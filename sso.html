<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev-Onix — Redirecting</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Georgia, serif; }
  body {
    background: #f4f6f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }
  .spin {
    width: 40px; height: 40px;
    border: 4px solid #dbe3ee;
    border-top-color: #1877f2;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { color: #65676b; font-size: 14px; }
  .error-box { color: #e02424; text-align: center; padding: 0 20px; }
</style>
</head>
<body>
  <div class="spin"></div>
  <p id="statusText">Signing in with Dev-Onix...</p>

  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const redirectUri = params.get('redirect_uri');
      const forceRelogin = params.get('force_relogin') === '1';
      const statusEl = document.getElementById('statusText');

      if (!redirectUri) {
        statusEl.className = 'error-box';
        statusEl.innerText = 'redirect_uri is required — this link was not opened correctly.';
        return;
      }

      try {
        // ================= force_relogin=1 হলে আগে Dev-Onix থেকে লগআউট করিয়ে দেওয়া হচ্ছে =================
        // এটা পার্টনার অ্যাপ (Dream Lens) থেকে আসে যখন ইউজার "Use another account" চাপে —
        // বর্তমান সেশন থাকলেও জোর করে লগআউট করে দিলে Dev-Onix তার নিজের লগইন ফর্ম দেখাবে,
        // যাতে ইউজার ভিন্ন ফোন নম্বর/পাসওয়ার্ড দিয়ে অন্য একাউন্টে ঢুকতে পারে।
        if (forceRelogin) {
          try { await fetch('/api/logout', { method: 'POST' }); } catch (e) {}
        }

        const res = await fetch('/api/me?mode=sso&redirect_uri=' + encodeURIComponent(redirectUri));

        if (res.status === 401) {
          // লগইন করা নেই -> লগইন পেজে পাঠানো হবে, লগইনের পর আবার এখানেই ফিরে আসবে
          const next = encodeURIComponent(window.location.href);
          window.location.href = 'index.html?next=' + next;
          return;
        }

        const data = await res.json();

        if (res.ok && data.redirect) {
          window.location.href = data.redirect;
        } else {
          statusEl.className = 'error-box';
          statusEl.innerText = data.error || 'Something went wrong, please try again.';
        }
      } catch (e) {
        statusEl.className = 'error-box';
        statusEl.innerText = 'Network error, please try again.';
      }
    })();
  </script>
</body>
</html>
