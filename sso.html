<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev-Onix — Redirecting</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Georgia, serif; }
  body {
    background: #f4f6f9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }
  .spin {
    width: 40px; height: 40px;
    border: 4px solid #dbe3ee;
    border-top-color: #1877f2;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { color: #65676b; font-size: 14px; }
  .error-box { color: #e02424; text-align: center; padding: 0 20px; }
</style>
</head>
<body>
  <div class="spin"></div>
  <p id="statusText">Dev-Onix দিয়ে সাইন ইন করা হচ্ছে...</p>

  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const redirectUri = params.get('redirect_uri');
      const statusEl = document.getElementById('statusText');

      if (!redirectUri) {
        statusEl.className = 'error-box';
        statusEl.innerText = 'redirect_uri প্রয়োজন — এই লিংকটা সঠিকভাবে খোলা হয়নি।';
        return;
      }

      try {
        const res = await fetch('/api/me?mode=sso&redirect_uri=' + encodeURIComponent(redirectUri));

        if (res.status === 401) {
          // লগইন করা নেই -> লগইন পেজে পাঠানো হবে, লগইনের পর আবার এখানেই ফিরে আসবে
          const next = encodeURIComponent(window.location.href);
          window.location.href = 'index.html?next=' + next;
          return;
        }

        const data = await res.json();

        if (res.ok && data.redirect) {
          window.location.href = data.redirect;
        } else {
          statusEl.className = 'error-box';
          statusEl.innerText = data.error || 'একটা সমস্যা হয়েছে, আবার চেষ্টা করুন।';
        }
      } catch (e) {
        statusEl.className = 'error-box';
        statusEl.innerText = 'নেটওয়ার্ক সমস্যা, আবার চেষ্টা করুন।';
      }
    })();
  </script>
</body>
</html>
