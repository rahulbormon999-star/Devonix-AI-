<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070f">
<meta name="description" content="Dev-Onix — a live, real-time view of the solar system.">
<title>Dev-Onix AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #05070f;
    --ink: #f4f7ff;
    --ink-dim: rgba(244,247,255,0.72);
    --accent: #7ec8ff;
    --accent-warm: #ffd06b;
    --glass: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.16);
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --radius: 16px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
  body {
    background: var(--bg);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    position: relative;
    overflow-x: hidden;
  }
  a, button { font-family: inherit; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  /* ================= UNIVERSE CANVAS (background) ================= */
  #universe {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    display: block;
    cursor: pointer;
  }

  /* Overlay (মেনু খুললে পেছনের কালো আস্তরণ) */
  #overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.5); opacity: 0; visibility: hidden;
    transition: 0.3s; z-index: 5;
  }
  #overlay.active { opacity: 1; visibility: visible; }

  /* মেনু বাটন */
  .menu-btn {
    position: fixed; top: clamp(16px, 4%, 28px); left: clamp(16px, 7%, 36px); cursor: pointer;
    width: clamp(42px, 9vw, 52px); height: clamp(42px, 9vw, 52px);
    border: 1px solid var(--glass-border);
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: clamp(18px, 5vw, 22px); color: var(--ink);
    transition: 0.25s var(--ease); z-index: 15;
    background: var(--glass);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .menu-btn:hover { background: rgba(255,255,255,0.14); }
  .menu-btn:active { transform: scale(0.92); }

  /* সাইড মেনু */
  .menu {
    position: fixed; top: 0; left: -100%; width: min(60%, 340px); height: 100%;
    background: rgba(10, 14, 26, 0.88);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-right: 1px solid var(--glass-border);
    transition: 0.45s var(--ease); padding: 22% 8% 6%; z-index: 20;
    box-shadow: 8px 0 40px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
  }
  .menu.active { left: 0; }

  .menu a {
    display: block; color: var(--ink); text-decoration: none;
    font-size: clamp(16px, 4vw, 19px); font-weight: 500;
    margin-bottom: 5%; padding: 3.5% 4%;
    border-radius: 10px; transition: 0.25s var(--ease); border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .menu a:hover { background: rgba(255,255,255,0.08); padding-left: 6%; }
  .menu a:active { transform: scale(0.98); }

  /* ক্লোজ বাটন */
  .close-btn {
    position: absolute; top: 4%; right: 6%;
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    font-size: clamp(18px, 5vw, 22px); color: var(--ink); cursor: pointer;
    border-radius: 50%; transition: 0.2s var(--ease);
  }
  .close-btn:hover { background: rgba(255,255,255,0.1); }

  /* মেনুর নিচে প্রোফাইল ছবি + Logout */
  .menu-footer {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    border-radius: 12px;
    border-top: 1px solid rgba(255,255,255,0.08);
    cursor: pointer;
    transition: background 0.2s var(--ease);
  }
  .menu-footer:hover { background: rgba(255,255,255,0.06); }
  .menu-footer:active { background: rgba(255,255,255,0.1); }
  .menu-footer-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    background: #1c2540;
    flex-shrink: 0;
    border: 1px solid var(--glass-border);
  }
  .menu-footer-text {
    font-weight: 600;
    color: #ff6b6b;
    font-size: 15px;
  }

  /* কন্টেন্ট */
  .title {
    position: relative;
    z-index: 2;
    margin: clamp(96px, 28vh, 200px) 0 0;
    text-align: center;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(34px, 9vw, 68px);
    line-height: 1.08;
    letter-spacing: -0.01em;
    animation: dropDown 1s var(--ease) forwards;
    pointer-events: none;

    background: linear-gradient(to right, var(--accent), #ffffff, var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 18px rgba(120, 190, 255, 0.45));
  }
  .title i{ font-style: italic; }
  .tagline{
    position: relative;
    z-index: 2;
    margin: 10px 0 0;
    text-align: center;
    font-family: var(--font-body);
    font-size: clamp(12px, 3.2vw, 15px);
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
    opacity: 0;
    animation: fadeUp 1s var(--ease) 0.4s forwards;
    pointer-events: none;
  }
  @keyframes dropDown {
    0% { transform: translateY(-40px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes fadeUp {
    0% { transform: translateY(10px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  h2 {
    font-family: var(--font-display);
    font-size: clamp(20px, 6vw, 28px); margin-top: 14%; font-weight: 600;
    background: linear-gradient(to right, var(--accent), #ffffff, var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
 .apps {
     text-align:center;
 }
.apps{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:10px;
    line-height:1;
}
.apps-logo{
    width:24px; height:24px; object-fit:contain; position:relative; top:3px;
}
.icon-wrapper{
    width: 64px; height: 64px; display:flex; align-items:center; justify-content:center;
}
.app-icon{
    width: 90%; height: 90%; object-fit: contain; position: relative; top:0;
}
@media (max-width:480px){ .apps-logo{ width:20px; height:20px; } }
@media (min-width:481px){ .apps-logo{ width:26px; height:26px; } }

/* auth চেক করার সময় দেখানো ব্র্যান্ডেড অরবিট-লোডার */
#authCheckOverlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 999;
    transition: opacity 0.4s var(--ease);
}
#authCheckOverlay .orbit-loader{
    position: relative;
    width: 46px; height: 46px;
}
#authCheckOverlay .orbit-loader .core{
    position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
    margin: -5px 0 0 -5px; border-radius: 50%;
    background: var(--accent-warm);
    box-shadow: 0 0 12px 2px rgba(255, 208, 107, 0.7);
}
#authCheckOverlay .orbit-loader .ring{
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid rgba(126,200,255,0.25);
    animation: spin 1.1s linear infinite;
}
#authCheckOverlay .orbit-loader .ring::after{
    content:''; position: absolute; top: -3px; left: 50%; width: 7px; height: 7px;
    margin-left: -3.5px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 8px 1px rgba(126,200,255,0.8);
}
@keyframes spin { to { transform: rotate(360deg); } }

/* নিচে স্ট্যাটাস বার (দিন/রাত + ঢাকা সময়) - সব ইংরেজিতে */
#skyStatus{
  position: fixed;
  bottom: clamp(18px, 3%, 30px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: var(--ink);
  font-weight: 600;
  font-size: clamp(11px, 3.2vw, 13px);
  letter-spacing: 0.06em;
  pointer-events: none;
  text-align: center;
}
#skyStatus .time{
  font-size: clamp(10px, 2.6vw, 12px);
  font-weight: 400;
  color: var(--ink-dim);
  border-left: 1px solid var(--glass-border);
  padding-left: 10px;
}

/* জুম করা অবস্থায় নাম-ট্যাগ ও ব্যাক বাটন */
#bodyLabel{
  position: fixed;
  top: 12%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  color: var(--ink);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(24px, 5vw, 36px);
  letter-spacing: 0;
  text-shadow: 0 2px 20px rgba(0,0,0,0.7);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.35s var(--ease), transform 0.35s var(--ease);
  transform: translate(-50%, 6px);
  text-align: center;
}
#bodyLabel.show{ opacity: 1; transform: translate(-50%, 0); }
#bodyLabel small{
  display:block;
  font-family: var(--font-body);
  font-size: clamp(11px, 2.6vw, 14px);
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-dim);
  margin-top: 4px;
}

#backBtn{
  position: fixed;
  top: clamp(16px, 5%, 30px);
  right: clamp(16px, 6%, 36px);
  z-index: 6;
  display: flex; align-items: center; gap: 6px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  color: var(--ink);
  font-size: clamp(12px, 3.4vw, 14px);
  font-weight: 600;
  padding: 9px 16px;
  border-radius: 999px;
  cursor: pointer;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-8px);
  transition: 0.25s var(--ease);
}
#backBtn.show{ opacity: 1; visibility: visible; transform: translateY(0); }
#backBtn:hover{ background: rgba(255,255,255,0.14); }
#backBtn:active{ transform: scale(0.94); }
</style>

<body>

  <div id="authCheckOverlay" role="status" aria-label="Loading">
    <div class="orbit-loader"><div class="ring"></div><div class="core"></div></div>
  </div>

  <!-- Universe background: sun, planets, moon, stars are all drawn here -->
  <canvas id="universe" role="img" aria-label="Live, real-time animation of the solar system, tap a planet to zoom in"></canvas>

  <!-- Overlay for closing menu -->

  <h1 class="title"><i>Welcome to <br>Dev-Onix</i></h1>
  <p class="tagline">A live view of the solar system, right now</p>

  <div id="bodyLabel" aria-live="polite"></div>
  <button id="backBtn" onclick="window.__exitFocus && window.__exitFocus()" aria-label="Return to full solar system view">✕ Solar System</button>

  <div id="skyStatus">
    <span id="dayNightText">DAY</span>
    <span class="time" id="dhakaTime">Dhaka --:--</span>
  </div>

  <div class="menu-btn" onclick="toggleMenu()" role="button" tabindex="0" aria-label="Open menu" onkeydown="if(event.key==='Enter')toggleMenu()">☰</div>

  <div class="menu" id="menu" aria-hidden="true">
    <div class="close-btn" onclick="toggleMenu()" role="button" tabindex="0" aria-label="Close menu">✖</div>

    <a href="#" onclick="gosetting()">⚙️ Setting</a>
    <a href="#" onclick="goabout()">❗ About</a>
<a href="#" onclick="goapps()" class="apps">
    <img src="1780474142335.png" class="apps-logo">
    <span>Apps</span>
</a>
    <h2><i>Dev-Onix</i></h2>

    <div class="menu-footer" onclick="logout()">
      <img class="menu-footer-avatar" id="menuFooterAvatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="">
      <span class="menu-footer-text">🚪 Logout</span>
    </div>
  </div>

  <script>

// ================= AUTH GUARD (Neon ব্যাকেন্ড দিয়ে) =================
(async function checkAuth(){
    const overlay = document.getElementById("authCheckOverlay");
    try {
        const res = await fetch('/api/me');
        if (!res.ok) {
            window.location.replace("index.html");
            return;
        }
        const { user } = await res.json();
        if (user.profile_picture) {
            document.getElementById("menuFooterAvatar").src = user.profile_picture;
        }
    } catch (e) {
        // নেটওয়ার্ক সমস্যা হলে পেইজেই থাকতে দেওয়া হচ্ছে
    } finally {
        overlay.style.opacity = "0";
        overlay.style.pointerEvents = "none";
        setTimeout(() => { overlay.style.display = "none"; }, 400);
    }
})();

window.toggleMenu = function () {
  const menu = document.getElementById("menu");
  const overlay = document.getElementById("overlay");
  const isOpen = menu.classList.toggle("active");
  overlay.classList.toggle("active");
  menu.setAttribute("aria-hidden", String(!isOpen));
};
window.goprofile = function () { window.location.href = "profile.html"; };
window.gosetting = function () { window.location.href = "setting.html"; };
window.goabout = function () { window.location.href = "about.html"; };
window.goapps = function () { window.location.href = "apps.html"; };
window.logout = async function () {
  try { await fetch('/api/logout', { method: 'POST' }); } catch(e) {}
  window.location.href = "index.html";
};

// ================================================================
// =========================  LIVE UNIVERSE  =====================
// Real-time solar system: planets sit at their actual current orbital
// angle (approximate circular model), day/night follows real Dhaka
// (Bangladesh, UTC+6) clock, tap a body to zoom in and see it up close.
// ================================================================
(function universe(){
  const canvas = document.getElementById('universe');
  const ctx = canvas.getContext('2d');
  const labelEl = document.getElementById('bodyLabel');
  const backBtn = document.getElementById('backBtn');
  const dayNightText = document.getElementById('dayNightText');
  const dhakaTimeEl = document.getElementById('dhakaTime');

  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
  let baseCY = 0, base = 0;

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    baseCY = H * 0.60;
    base = Math.min(W, H) * 0.62;
    buildStars();
  }

  // ---------------- deterministic PRNG (so surface detail stays fixed) ----------------
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------------- stars ----------------
  let stars = [];
  function buildStars(){
    const count = Math.floor((W * H) / 5500);
    stars = [];
    for (let i = 0; i < count; i++){
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.3 + 0.3,
        phase: Math.random() * Math.PI * 2,
        speed: 0.6 + Math.random() * 1.4
      });
    }
  }

  // ---------------- planets: real (approx) orbital elements ----------------
  // period: orbital period in Earth days. L0: mean longitude (deg) at J2000.0 epoch.
  // orbit: display radius fraction (NOT to real scale - compressed to fit the screen).
  const planets = [
    { key:'mercury', name:'Mercury', orbit: 0.16, period: 87.969,  L0: 252.25, size: 3.0, color: '#b9b0a6', glow: 'rgba(185,176,166,0.25)', kind:'cratered' },
    { key:'venus',   name:'Venus',   orbit: 0.24, period: 224.701, L0: 181.98, size: 4.6, color: '#e8caa0', glow: 'rgba(232,202,160,0.3)', kind:'banded-soft' },
    { key:'earth',   name:'Earth',   orbit: 0.34, period: 365.256, L0: 100.47, size: 5.0, color: '#4ea3ff', glow: 'rgba(78,163,255,0.35)', kind:'earth', hasMoon: true },
    { key:'mars',    name:'Mars',    orbit: 0.43, period: 686.980, L0: 355.45, size: 3.8, color: '#e07a55', glow: 'rgba(224,122,85,0.3)', kind:'cratered' },
    { key:'jupiter', name:'Jupiter', orbit: 0.55, period: 4332.59, L0: 34.40,  size: 8.4, color: '#dcb98d', glow: 'rgba(220,185,141,0.3)', kind:'banded' },
    { key:'saturn',  name:'Saturn',  orbit: 0.66, period: 10759.22,L0: 49.94,  size: 7.2, color: '#e6d3a3', glow: 'rgba(230,211,163,0.3)', kind:'banded', ring: true }
  ];

  // precompute fixed surface features per planet (seeded, so they never jitter)
  planets.forEach((p, idx) => {
    const rnd = mulberry32(1000 + idx * 77);
    const n = p.kind === 'earth' ? 6 : (p.kind === 'cratered' ? 10 : 6);
    p.features = [];
    for (let i = 0; i < n; i++){
      p.features.push({
        ang: rnd() * Math.PI * 2,
        rad: rnd() * 0.78,
        size: 0.14 + rnd() * 0.22,
        shade: rnd()
      });
    }
  });
  const sunFeatures = (() => {
    const rnd = mulberry32(99);
    const arr = [];
    for (let i = 0; i < 8; i++){
      arr.push({ ang: rnd()*Math.PI*2, rad: rnd()*0.7, size: 0.15+rnd()*0.25, shade: rnd() });
    }
    return arr;
  })();

  const J2000 = Date.UTC(2000, 0, 1, 12, 0, 0);
  function orbitAngle(p, now){
    const days = (now.getTime() - J2000) / 86400000;
    let deg = (p.L0 + (days / p.period) * 360) % 360;
    if (deg < 0) deg += 360;
    return deg * Math.PI / 180;
  }

  // Bangladesh (Dhaka) local time, UTC+6, no DST
  function getDhakaTime(){
    const now = new Date();
    const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
    return new Date(utcMs + 6 * 3600000);
  }

  function lerpColor(hexA, hexB, t){
    const a = hexA.match(/\w\w/g).map(x => parseInt(x, 16));
    const b = hexB.match(/\w\w/g).map(x => parseInt(x, 16));
    const r = Math.round(a[0] + (b[0]-a[0])*t);
    const g = Math.round(a[1] + (b[1]-a[1])*t);
    const bl = Math.round(a[2] + (b[2]-a[2])*t);
    return `rgb(${r},${g},${bl})`;
  }

  function drawSky(bright){
    const topColor = lerpColor('#1a2450', '#2f7fd6', bright);
    const botColor = lerpColor('#05070f', '#bfe4ff', bright);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, topColor);
    g.addColorStop(1, botColor);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawStars(nightAmt, t){
    if (nightAmt <= 0.02) return;
    ctx.save();
    for (const s of stars){
      const tw = (Math.sin(t * s.speed + s.phase) + 1) / 2;
      ctx.globalAlpha = nightAmt * (0.35 + tw * 0.65);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // ---------------- camera (pan + zoom) ----------------
  const camera = { focusX: 0, focusY: 0, scale: 1 };
  const target = { focusX: 0, focusY: 0, scale: 1, key: null, name: null };
  let focusedKey = null;

  function w2s(wx, wy){
    return {
      x: W / 2 + (wx - camera.focusX) * camera.scale,
      y: baseCY + (wy - camera.focusY) * camera.scale
    };
  }

  function setFocus(body){
    focusedKey = body ? body.key : null;
    if (!body){
      target.focusX = 0; target.focusY = 0; target.scale = 1; target.name = null;
      backBtn.classList.remove('show');
      labelEl.classList.remove('show');
      return;
    }
    target.focusX = body.wx; target.focusY = body.wy;
    const desiredScreenR = Math.min(W, H) * 0.26;
    let sc = desiredScreenR / body.sizeWorld;
    sc = Math.max(camera.scale, Math.min(sc, 60));
    target.scale = sc;
    target.name = body.name;
    backBtn.classList.add('show');
    labelEl.classList.add('show');
    labelEl.innerHTML = body.name + (body.sub ? '<small>' + body.sub + '</small>' : '');
  }
  window.__exitFocus = () => setFocus(null);

  // list of clickable bodies rebuilt every frame
  let hitList = [];

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    let hit = null, bestD = Infinity;
    for (const b of hitList){
      const d = Math.hypot(cx - b.sx, cy - b.sy);
      const thresh = Math.max(16, b.sr * 1.4);
      if (d <= thresh && d < bestD){ bestD = d; hit = b; }
    }
    if (hit) setFocus(hit);
    else setFocus(null);
  });

  // ---------------- surface detail drawers (shown once zoomed close) ----------------
  function drawFeatures(sx, sy, sr, features, palette){
    ctx.save();
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI*2); ctx.clip();
    for (const f of features){
      const fx = sx + Math.cos(f.ang) * f.rad * sr;
      const fy = sy + Math.sin(f.ang) * f.rad * sr;
      const fr = f.size * sr;
      ctx.fillStyle = f.shade > 0.5 ? palette.light : palette.dark;
      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      ctx.arc(fx, fy, fr, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawBands(sx, sy, sr, t, baseColor){
    ctx.save();
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI*2); ctx.clip();
    const bands = 7;
    for (let i = 0; i < bands; i++){
      const yFrac = -1 + (2 / bands) * i + Math.sin(t*0.2 + i)*0.02;
      const by = sy + yFrac * sr;
      const bh = (sr * 2 / bands) * 0.85;
      ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.12)';
      ctx.fillRect(sx - sr, by - bh/2, sr*2, bh);
    }
    ctx.restore();
  }

  function drawEarthMap(sx, sy, sr, t){
    ctx.save();
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI*2); ctx.clip();
    // ocean
    const oc = ctx.createRadialGradient(sx-sr*0.3, sy-sr*0.3, sr*0.1, sx, sy, sr);
    oc.addColorStop(0, '#8fd0ff');
    oc.addColorStop(1, '#1c5fa8');
    ctx.fillStyle = oc;
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI*2); ctx.fill();
    // rotating continents
    const spin = t * 0.15;
    ctx.fillStyle = '#3fa65a';
    const blobs = [
      {a:0.2,r:0.55,w:0.55,h:0.35},
      {a:2.1,r:0.6,w:0.4,h:0.5},
      {a:3.4,r:0.5,w:0.45,h:0.3},
      {a:4.6,r:0.62,w:0.3,h:0.5},
      {a:5.6,r:0.5,w:0.4,h:0.28}
    ];
    for (const b of blobs){
      const ang = b.a + spin;
      const bx = sx + Math.cos(ang) * b.r * sr;
      const by = sy + Math.sin(ang) * b.r * sr * 0.9;
      ctx.beginPath();
      ctx.ellipse(bx, by, b.w*sr*0.35, b.h*sr*0.35, ang, 0, Math.PI*2);
      ctx.fill();
    }
    // clouds
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 5; i++){
      const ang = spin * -0.6 + i * 1.3;
      const cxp = sx + Math.cos(ang) * 0.7 * sr;
      const cyp = sy + Math.sin(ang) * 0.6 * sr;
      ctx.beginPath();
      ctx.ellipse(cxp, cyp, sr*0.28, sr*0.12, ang, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // day/night terminator shading + faint atmosphere rim
    ctx.save();
    ctx.globalAlpha = 0.4;
    const rim = ctx.createRadialGradient(sx, sy, sr*0.85, sx, sy, sr*1.08);
    rim.addColorStop(0, 'rgba(140,200,255,0)');
    rim.addColorStop(1, 'rgba(140,200,255,0.55)');
    ctx.fillStyle = rim;
    ctx.beginPath(); ctx.arc(sx, sy, sr*1.08, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawSunSurface(sx, sy, sr, t){
    ctx.save();
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI*2); ctx.clip();
    const core = ctx.createRadialGradient(sx-sr*0.2, sy-sr*0.2, sr*0.1, sx, sy, sr);
    core.addColorStop(0, '#fff6da');
    core.addColorStop(0.55, '#ffd06b');
    core.addColorStop(1, '#ff8a3d');
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI*2); ctx.fill();
    for (const f of sunFeatures){
      const ang = f.ang + t*0.05;
      const fx = sx + Math.cos(ang) * f.rad * sr;
      const fy = sy + Math.sin(ang) * f.rad * sr;
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = f.shade > 0.5 ? '#fff2c4' : '#c9560f';
      ctx.beginPath();
      ctx.arc(fx, fy, f.size*sr, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---------------- moon phase ----------------
  function drawMoon(sx, sy, r, phaseAngle){
    const illum = (1 - Math.cos(phaseAngle)) / 2;
    const side = Math.sin(phaseAngle) >= 0 ? 1 : -1;
    const offset = side * (illum * 2 * r - r);

    ctx.save();
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.clip();

    ctx.fillStyle = '#eef2f8';
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();

    // craters for extra detail when zoomed
    if (r > 30){
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = '#c7ccd6';
      const rnd = mulberry32(555);
      for (let i = 0; i < 8; i++){
        const ang = rnd()*Math.PI*2, rad = rnd()*0.7;
        ctx.beginPath();
        ctx.arc(sx + Math.cos(ang)*rad*r, sy + Math.sin(ang)*rad*r, (0.08+rnd()*0.1)*r, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = '#141a2e';
    ctx.beginPath();
    ctx.arc(sx + offset, sy, r * 1.02, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.35;
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * 2.2);
    g.addColorStop(0, 'rgba(238,242,248,0.4)');
    g.addColorStop(1, 'rgba(238,242,248,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, r * 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawSunGlow(sx, sy, sr, t, scale){
    const pulse = 1 + Math.sin(t * 1.4) * 0.05;
    const glowR = sr * 7 * pulse;
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, glowR);
    g.addColorStop(0, 'rgba(255, 226, 150, 0.55)');
    g.addColorStop(0.25, 'rgba(255, 200, 110, 0.22)');
    g.addColorStop(1, 'rgba(255, 200, 110, 0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(sx, sy, glowR, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(t * 0.1);
    ctx.globalAlpha = 0.18;
    ctx.strokeStyle = '#ffe3a3';
    ctx.lineWidth = Math.max(1, scale * 0.15);
    const rays = 14;
    for (let i = 0; i < rays; i++){
      const ang = (Math.PI * 2 / rays) * i;
      const len = sr * (3 + Math.sin(t * 2 + i) * 0.7);
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang) * sr * 1.3, Math.sin(ang) * sr * 1.3);
      ctx.lineTo(Math.cos(ang) * len, Math.sin(ang) * len);
      ctx.stroke();
    }
    ctx.restore();

    if (sr > 60){
      drawSunSurface(sx, sy, sr, t);
    } else {
      const core = ctx.createRadialGradient(sx - sr*0.25, sy - sr*0.25, sr*0.1, sx, sy, sr);
      core.addColorStop(0, '#fff6da');
      core.addColorStop(0.6, '#ffd06b');
      core.addColorStop(1, '#ff9d3d');
      ctx.fillStyle = core;
      ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
    }
  }

  function frame(now){
    const t = now / 1000;
    const clock = getDhakaTime();
    const hour = clock.getHours() + clock.getMinutes()/60 + clock.getSeconds()/3600;
    const bright = (Math.cos((hour - 12) * Math.PI / 12) + 1) / 2; // real Dhaka day/night
    const nightAmt = 1 - bright;

    // smooth camera easing toward target
    camera.focusX += (target.focusX - camera.focusX) * 0.08;
    camera.focusY += (target.focusY - camera.focusY) * 0.08;
    camera.scale  += (target.scale  - camera.scale)  * 0.08;

    drawSky(bright);
    drawStars(nightAmt, t);

    hitList = [];

    // orbit rings
    ctx.save();
    ctx.strokeStyle = `rgba(255,255,255,${0.10 + nightAmt * 0.08})`;
    ctx.lineWidth = 1;
    for (const p of planets){
      const c = w2s(0, 0);
      ctx.beginPath();
      ctx.arc(c.x, c.y, base * p.orbit * camera.scale, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();

    // Sun (fixed at world origin — every planet's orbit stays locked to this point)
    const sunWorldR = Math.max(10, base * 0.045);
    const sunScreen = w2s(0, 0);
    const sunScreenR = sunWorldR * camera.scale;
    drawSunGlow(sunScreen.x, sunScreen.y, sunScreenR, t, camera.scale);
    hitList.push({ key:'sun', name:'Sun', sx:sunScreen.x, sy:sunScreen.y, sr:sunScreenR, wx:0, wy:0, sizeWorld:sunWorldR });

    for (const p of planets){
      const ang = orbitAngle(p, clock);
      const orbitR = base * p.orbit;
      const wx = Math.cos(ang) * orbitR;
      const wy = Math.sin(ang) * orbitR;
      const s = w2s(wx, wy);
      const sr = p.size * camera.scale;

      // glow
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, sr * 3);
      g.addColorStop(0, p.glow);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(s.x, s.y, sr * 3, 0, Math.PI * 2); ctx.fill();

      if (p.ring){
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(0.5);
        ctx.strokeStyle = 'rgba(230,211,163,0.7)';
        ctx.lineWidth = Math.max(1, 2 * camera.scale * 0.2);
        ctx.beginPath();
        ctx.ellipse(0, 0, sr * 2.1, sr * 0.7, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // body
      if (sr > 45){
        // zoomed in: show surface detail
        if (p.kind === 'earth') drawEarthMap(s.x, s.y, sr, t);
        else if (p.kind === 'banded' || p.kind === 'banded-soft') {
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(s.x, s.y, sr, 0, Math.PI*2); ctx.fill();
          drawBands(s.x, s.y, sr, t, p.color);
        } else {
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(s.x, s.y, sr, 0, Math.PI*2); ctx.fill();
          drawFeatures(s.x, s.y, sr, p.features, { light:'#ffffff', dark:'#00000055' });
        }
      } else {
        const body = ctx.createRadialGradient(s.x - sr*0.3, s.y - sr*0.3, sr*0.1, s.x, s.y, sr);
        body.addColorStop(0, '#ffffff');
        body.addColorStop(0.35, p.color);
        body.addColorStop(1, '#000000');
        ctx.fillStyle = body;
        ctx.beginPath(); ctx.arc(s.x, s.y, sr, 0, Math.PI * 2); ctx.fill();
      }

      hitList.push({ key:p.key, name:p.name, sx:s.x, sy:s.y, sr:sr, wx:wx, wy:wy, sizeWorld:p.size });

      // Moon (bigger + real illumination angle based on Sun-Earth-Moon geometry)
      if (p.hasMoon){
        const moonOrbitR = p.size * 4.4;               // bigger orbit so it's clearly separate
        const moonPeriodDays = 27.32;
        const moonAng = orbitAngle({ L0: 0, period: moonPeriodDays }, clock) + ang;
        const mwx = wx + Math.cos(moonAng) * moonOrbitR;
        const mwy = wy + Math.sin(moonAng) * moonOrbitR;
        const ms = w2s(mwx, mwy);
        const moonR = Math.max(2.6, p.size * 0.62) * camera.scale; // bigger, clearly visible
        const phaseAngle = moonAng - ang;
        drawMoon(ms.x, ms.y, moonR, phaseAngle);
        hitList.push({ key:'moon', name:'Moon', sub:'Earth\'s Moon', sx:ms.x, sy:ms.y, sr:moonR, wx:mwx, wy:mwy, sizeWorld: moonR / camera.scale });
      }
    }

    // keep focused body perfectly centered/tracked even while it orbits
    if (focusedKey){
      const b = hitList.find(x => x.key === focusedKey);
      if (b){ target.focusX = b.wx; target.focusY = b.wy; }
    }

    dayNightText.textContent = bright > 0.55 ? 'DAY' : (bright < 0.45 ? 'NIGHT' : (hour < 12 ? 'DAWN' : 'DUSK'));
    const hh = String(clock.getHours()).padStart(2,'0');
    const mm = String(clock.getMinutes()).padStart(2,'0');
    dhakaTimeEl.textContent = `Dhaka ${hh}:${mm}`;
  }

  // পারফরম্যান্স: ট্যাব/অ্যাপ ব্যাকগ্রাউন্ডে গেলে rAF লুপ পজ করা হয় (ব্যাটারি ও CPU বাঁচাতে)
  let rafId = null;
  function loop(now){ rafId = requestAnimationFrame(loop); frame(now); }
  function startLoop(){ if (rafId === null) rafId = requestAnimationFrame(loop); }
  function stopLoop(){ if (rafId !== null){ cancelAnimationFrame(rafId); rafId = null; } }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopLoop(); else startLoop();
  });

  window.addEventListener('resize', resize);
  resize();
  startLoop();
})();
  </script>
</body>
