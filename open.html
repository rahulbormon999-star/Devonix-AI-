<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev-Onix AI</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 0; background: #05070f; font-family: 'Georgia', serif; height: 100vh; display: flex; flex-direction: column; align-items: center; overflow: hidden; }

  /* ================= 3D ইউনিভার্স ক্যানভাস ================= */
  #universe {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 0;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #universe:active { cursor: grabbing; }

  /* Overlay (মেনু খুললে পেছনের কালো আস্তরণ) */
  #overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.5); opacity: 0; visibility: hidden;
    transition: 0.3s; z-index: 5;
  }
  #overlay.active { opacity: 1; visibility: visible; }

  /* মেনু বাটন */
  .menu-btn {
    position: fixed; top: 4%; left: 7%; cursor: pointer;
    width: 9vw; height: 5vh; border: 2px solid #000;
    border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 6vw; transition: 0.3s; z-index: 15; background: #fff;
  }
  .menu-btn:active { transform: scale(0.9); }

  /* সাইড মেনু */
  .menu {
    position: fixed; top: 0; left: -100%; width: 60%; height: 100%;
    background: #fff; border-right: 1px solid #ddd;
    transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); padding: 20% 8% 6%; z-index: 20;
    box-shadow: 2px 0 10px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
  }
  .menu.active { left: 0; }

  .menu a {
    display: block; color: #333; text-decoration: none;
    font-size: 4vw; margin-bottom: 6%; padding: 3%;
    border-radius: 10px; transition: 0.3s; border-bottom: 1px solid #f0f0f0;
  }
  .menu a:hover { background: #f9f9f9; }
  .menu a:active { transform: scale(0.98); background: #eee; }

  /* ক্লোজ বাটন */
  .close-btn { position: absolute; top: 3%; right: 5%; font-size: 7vw; cursor: pointer; }

  /* মেনুর নিচে প্রোফাইল ছবি + Logout */
  .menu-footer {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    border-radius: 12px;
    border-top: 1px solid #f0f0f0;
    cursor: pointer;
    transition: background 0.2s;
  }
  .menu-footer:active { background: #f5f5f5; }
  .menu-footer-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    background: #eee;
    flex-shrink: 0;
    border: 1px solid #e2e8f0;
  }
  .menu-footer-text {
    font-weight: 700;
    color: #e02424;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 15px;
  }

 .apps {
     text-align:center;
 }
.apps{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap:10px;
    line-height:1;
}
.apps-logo{
    width:24px; height:24px; object-fit:contain; position:relative; top:3px;
}
.icon-wrapper{
    width: 64px; height: 64px; display:flex; align-items:center; justify-content:center;
}
.app-icon{
    width: 90%; height: 90%; object-fit: contain; position: relative; top:0;
}
@media (max-width:480px){ .apps-logo{ width:20px; height:20px; } }
@media (min-width:481px){ .apps-logo{ width:26px; height:26px; } }

/* auth চেক করার সময় দেখানো স্পিনার */
#authCheckOverlay {
    position: fixed; inset: 0; background: #05070f;
    display: flex; align-items: center; justify-content: center; z-index: 999;
}
#authCheckOverlay .spin {
    width: 34px; height: 34px;
    border: 3px solid #1c2540;
    border-top-color: #7ec8ff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* জুম করে কোনো গ্রহে ফোকাস করলে তার নাম এখানে দেখাবে */
#bodyLabel{
  position: fixed;
  top: 5%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  background: #fff;
  border: 2px solid #000;
  border-radius: 8px;
  padding: 1.5% 4%;
  color: #111;
  font-family: 'Georgia', serif;
  font-weight: 700;
  font-size: 4.2vw;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s;
}
#bodyLabel.show{ opacity: 1; }
#bodyLabel small{
  display:block;
  font-family: system-ui, -apple-system, sans-serif;
  font-weight: 400;
  font-size: 2.6vw;
  color: #555;
}

/* সৌরজগতের পূর্ণ দৃশ্যে ফিরে যাওয়ার বাটন */
#backBtn{
  position: fixed;
  top: 4%;
  right: 7%;
  z-index: 15;
  background: #fff;
  border: 2px solid #000;
  border-radius: 8px;
  color: #111;
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 3.4vw;
  padding: 1.6% 3.5%;
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  transition: 0.25s;
}
#backBtn.show{ opacity: 1; visibility: visible; }
#backBtn:active{ transform: scale(0.94); }
</style>
</head>
<body>

  <div id="authCheckOverlay"><div class="spin"></div></div>

  <!-- মহাবিশ্ব: সত্যিকারের 3D - হাত দিয়ে ঘোরানো ও জুম করা যায় -->
  <canvas id="universe"></canvas>

  <!-- Overlay for closing menu -->
  <div id="overlay" onclick="toggleMenu()"></div>

  <div id="bodyLabel"></div>
  <button id="backBtn" onclick="window.__exitFocus && window.__exitFocus()">✕ Back</button>

  <div class="menu-btn" onclick="toggleMenu()">☰</div>

  <div class="menu" id="menu">
    <div class="close-btn" onclick="toggleMenu()">✖</div>
    <a href="#">🏠 Home</a>
    <a href="#" onclick="goprofile()">👤 Profile</a>
    <a href="#" onclick="gosetting()">⚙️ Setting</a>
    <a href="#" onclick="goabout()">❗ About</a>
<a href="#" onclick="goapps()" class="apps">
    <img src="1780474142335.png" class="apps-logo">
    <span>Apps</span>
</a>
    <h2><i>Dev-Onix</i></h2>

    <div class="menu-footer" onclick="logout()">
      <img class="menu-footer-avatar" id="menuFooterAvatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="">
      <span class="menu-footer-text">🚪 Logout</span>
    </div>
  </div>

  <script>

// ================= AUTH GUARD (Neon ব্যাকেন্ড দিয়ে) =================
// সেশন না থাকলে বা এডমিন থেকে ইউজার ডিলিট হয়ে থাকলে index.html এ পাঠানো হবে
(async function checkAuth(){
    const overlay = document.getElementById("authCheckOverlay");
    try {
        const res = await fetch('/api/me');
        if (!res.ok) {
            window.location.replace("index.html");
            return;
        }
        const { user } = await res.json();
        if (user.profile_picture) {
            document.getElementById("menuFooterAvatar").src = user.profile_picture;
        }
    } catch (e) {
        // নেটওয়ার্ক সমস্যা হলে পেইজেই থাকতে দেওয়া হচ্ছে
    } finally {
        overlay.style.display = "none";
    }
})();

// Menu Toggle
window.toggleMenu = function () {
  const menu = document.getElementById("menu");
  const overlay = document.getElementById("overlay");
  menu.classList.toggle("active");
  overlay.classList.toggle("active");
};

// Navigation Functions
window.goprofile = function () { window.location.href = "profile.html"; };
window.gosetting = function () { window.location.href = "setting.html"; };
window.goabout  = function () { window.location.href = "about.html"; };
window.goapps   = function () { window.location.href = "apps.html"; };

window.logout = async function () {
  try { await fetch('/api/logout', { method: 'POST' }); } catch(e) {}
  window.location.href = "index.html";
};
  </script>

  <!-- ================================================================ -->
  <!-- =====================  সত্যিকারের 3D মহাবিশ্ব  ===================== -->
  <!-- হাত/মাউস দিয়ে ঘোরানো ও পিঞ্চ-জুম করা যায় (Three.js + OrbitControls)-->
  <!-- সূর্যালোকের কারণে প্রতিটি গ্রহে বাস্তবের মতো দিন-রাত পাশ তৈরি হয়    -->
  <!-- পৃথিবীতে জুম করলে ক্রমশ মহাদেশ ও দেশগুলোর নাম-অবস্থান দেখা যায়      -->
  <!-- ================================================================ -->
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    const canvas = document.getElementById('universe');
    const labelEl = document.getElementById('bodyLabel');
    const backBtn = document.getElementById('backBtn');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02030a);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.02, 3000);
    camera.position.set(0, 55, 130);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 0.55;   // পৃথিবীর একদম কাছে গিয়ে ঢুকে দেখা যাবে
    controls.maxDistance = 650;
    controls.zoomSpeed = 0.9;
    controls.rotateSpeed = 0.55;
    controls.panSpeed = 0.6;

    // ---------------- তারাভরা আকাশ ----------------
    (function buildStars(){
      const count = 5000;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count; i++){
        const r = 350 + Math.random() * 550;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(Math.random() * 2 - 1);
        positions[i*3]     = r * Math.sin(phi) * Math.cos(theta);
        positions[i*3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i*3 + 2] = r * Math.cos(phi);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.15, sizeAttenuation: true });
      scene.add(new THREE.Points(geo, mat));
    })();

    // ---------------- আলো ----------------
    const sunLight = new THREE.PointLight(0xfff2cc, 3.2, 0, 0);
    scene.add(sunLight);
    scene.add(new THREE.AmbientLight(0x1c2c55, 0.55)); // রাতের পাশ যেন পুরো কালো না হয়ে যায়

    // ---------------- glow টেক্সচার (সূর্যের আভা) ----------------
    function makeGlowTexture(){
      const size = 256;
      const c = document.createElement('canvas'); c.width = c.height = size;
      const cx = c.getContext('2d');
      const g = cx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
      g.addColorStop(0, 'rgba(255,244,214,0.95)');
      g.addColorStop(0.35, 'rgba(255,205,120,0.4)');
      g.addColorStop(1, 'rgba(255,205,120,0)');
      cx.fillStyle = g; cx.fillRect(0, 0, size, size);
      return new THREE.CanvasTexture(c);
    }

    // ---------------- সূর্য ----------------
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(4, 48, 48),
      new THREE.MeshBasicMaterial({ color: 0xffd27a })
    );
    scene.add(sun);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: makeGlowTexture(), color: 0xffd27a, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    glow.scale.set(30, 30, 1);
    sun.add(glow);

    // ---------------- পৃথিবীর ম্যাপ টেক্সচার (মহাদেশ + দেশের নাম + গ্র্যাটিকিউল) ----------------
    function makeEarthTexture(){
      const w = 2048, h = 1024;
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const cx = c.getContext('2d');

      const ocean = cx.createLinearGradient(0, 0, 0, h);
      ocean.addColorStop(0, '#1c4f82');
      ocean.addColorStop(0.5, '#155a95');
      ocean.addColorStop(1, '#0c3righteous'.length ? '#0c3a63' : '#0c3a63');
      cx.fillStyle = ocean; cx.fillRect(0, 0, w, h);

      function project(lat, lon){
        return [ (lon + 180) / 360 * w, (90 - lat) / 180 * h ];
      }

      // মহাদেশের সরলীকৃত (approximate) আকার - সঠিক অবস্থানে
      const continents = {
        northAmerica: [[71,-156],[70,-100],[62,-80],[49,-60],[30,-81],[16,-95],[20,-106],[32,-117],[49,-125],[60,-140]],
        southAmerica: [[11,-72],[5,-60],[-4,-35],[-22,-41],[-34,-58],[-55,-68],[-40,-73],[-16,-75],[1,-79]],
        africa: [[36,-6],[33,11],[22,32],[10,45],[-11,42],[-34,20],[-29,15],[-8,12],[6,-6],[15,-17]],
        europe: [[70,25],[60,42],[45,40],[36,25],[38,-9],[44,-2],[52,3],[60,6],[66,15]],
        asia: [[70,60],[71,140],[60,163],[42,141],[22,111],[10,95],[8,78],[20,65],[36,50],[50,45],[60,55]],
        australia: [[-12,113],[-12,145],[-25,153],[-38,146],[-35,117],[-20,113]]
      };
      cx.fillStyle = '#3f9856';
      cx.strokeStyle = 'rgba(0,0,0,0.3)';
      cx.lineWidth = 1.5;
      for (const key in continents){
        const pts = continents[key];
        cx.beginPath();
        pts.forEach((p, i) => {
          const [x, y] = project(p[0], p[1]);
          if (i === 0) cx.moveTo(x, y); else cx.lineTo(x, y);
        });
        cx.closePath();
        cx.fill();
        cx.stroke();
      }

      // অক্ষরেখা-দ্রাঘিমারেখা (graticule)
      cx.strokeStyle = 'rgba(255,255,255,0.09)';
      cx.lineWidth = 1;
      for (let lon = -180; lon <= 180; lon += 20){
        const [x1,y1] = project(90, lon), [x2,y2] = project(-90, lon);
        cx.beginPath(); cx.moveTo(x1,y1); cx.lineTo(x2,y2); cx.stroke();
      }
      for (let lat = -80; lat <= 80; lat += 20){
        const [x1,y1] = project(lat, -180), [x2,y2] = project(lat, 180);
        cx.beginPath(); cx.moveTo(x1,y1); cx.lineTo(x2,y2); cx.stroke();
      }

      // প্রধান দেশগুলোর নাম - সঠিক অবস্থানে (কাছে জুম করলে স্পষ্ট দেখা যাবে)
      const countries = [
        ['USA',39,-98],['Canada',56,-106],['Mexico',23,-102],['Brazil',-10,-55],['Argentina',-38,-63],
        ['UK',54,-2],['France',46,2],['Germany',51,9],['Spain',40,-4],['Russia',61,90],
        ['Egypt',26,30],['Nigeria',9,8],['South Africa',-29,24],['Saudi Arabia',24,45],
        ['China',35,103],['India',21,78],['Bangladesh',24,90],['Japan',36,138],
        ['Indonesia',-2,118],['Australia',-25,133],['Kazakhstan',48,68],['Pakistan',30,70],
        ['Iran',32,53],['Turkey',39,35],['Sudan',15,30],['Algeria',28,3]
      ];
      cx.fillStyle = '#ffffff';
      cx.font = '600 22px system-ui, sans-serif';
      cx.textAlign = 'center';
      cx.shadowColor = 'rgba(0,0,0,0.6)';
      cx.shadowBlur = 3;
      countries.forEach(([name, lat, lon]) => {
        const [x, y] = project(lat, lon);
        cx.fillText(name, x, y);
      });

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return tex;
    }
    const earthTexture = makeEarthTexture();

    // ---------------- সাধারণ গ্রহের টেক্সচার (দাগ/ব্যান্ড, একবারই তৈরি হয়) ----------------
    function makeSurfaceTexture(baseColor, kind){
      const w = 1024, h = 512;
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const cx = c.getContext('2d');
      cx.fillStyle = baseColor; cx.fillRect(0, 0, w, h);
      if (kind === 'banded'){
        for (let i = 0; i < 10; i++){
          cx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.10)';
          cx.fillRect(0, (h/10)*i, w, h/10);
        }
      } else if (kind === 'cratered'){
        for (let i = 0; i < 140; i++){
          cx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.12)';
          const r = 4 + Math.random() * 14;
          cx.beginPath();
          cx.arc(Math.random()*w, Math.random()*h, r, 0, Math.PI*2);
          cx.fill();
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // ---------------- গ্রহের তথ্য (প্রকৃত কক্ষপথকাল ও J2000 অবস্থান থেকে হিসেবকৃত) ----------------
    const planetDefs = [
      { key:'mercury', name:'Mercury', orbit:9,  period:87.969,   L0:252.25, size:0.5, color:0xb9b0a6, kind:'cratered' },
      { key:'venus',   name:'Venus',   orbit:13, period:224.701,  L0:181.98, size:0.9, color:0xe8caa0, kind:'banded' },
      { key:'earth',   name:'Earth',   orbit:18, period:365.256,  L0:100.47, size:1.0, color:0x2a5fb0, kind:'earth', hasMoon:true },
      { key:'mars',    name:'Mars',    orbit:24, period:686.980,  L0:355.45, size:0.7, color:0xe07a55, kind:'cratered' },
      { key:'jupiter', name:'Jupiter', orbit:34, period:4332.59,  L0:34.40,  size:2.6, color:0xdcb98d, kind:'banded' },
      { key:'saturn',  name:'Saturn',  orbit:44, period:10759.22, L0:49.94,  size:2.2, color:0xe6d3a3, kind:'banded', ring:true }
    ];

    const J2000 = Date.UTC(2000, 0, 1, 12, 0, 0);
    function orbitAngle(period, L0, now){
      const days = (now.getTime() - J2000) / 86400000;
      let deg = (L0 + (days / period) * 360) % 360;
      if (deg < 0) deg += 360;
      return deg * Math.PI / 180;
    }

    const clickable = []; // { name, obj, size, sub }
    const bodies = [];    // for per-frame orbital update

    // orbit path রেখা (দৃশ্যগত সহায়তার জন্য, static)
    function addOrbitLine(radius){
      const pts = [];
      for (let i = 0; i <= 128; i++){
        const a = (i / 128) * Math.PI * 2;
        pts.push(new THREE.Vector3(Math.cos(a)*radius, 0, Math.sin(a)*radius));
      }
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const mat = new THREE.LineBasicMaterial({ color: 0x3a4a72, transparent: true, opacity: 0.5 });
      scene.add(new THREE.Line(geo, mat));
    }

    planetDefs.forEach(def => {
      addOrbitLine(def.orbit);

      const pivot = new THREE.Object3D();
      scene.add(pivot);

      const geo = new THREE.SphereGeometry(def.size, def.kind === 'earth' ? 96 : 48, def.kind === 'earth' ? 96 : 48);
      const map = def.kind === 'earth' ? earthTexture : makeSurfaceTexture('#' + def.color.toString(16).padStart(6,'0'), def.kind);
      const mat = new THREE.MeshStandardMaterial({ map, roughness: 0.85, metalness: 0.0 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(def.orbit, 0, 0);
      pivot.add(mesh);

      if (def.ring){
        const ringGeo = new THREE.RingGeometry(def.size * 1.5, def.size * 2.4, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xe6d3a3, side: THREE.DoubleSide, transparent: true, opacity: 0.55 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2.3;
        mesh.add(ring);
      }

      let moonMesh = null;
      if (def.hasMoon){
        const moonPivot = new THREE.Object3D();
        mesh.add(moonPivot);
        moonMesh = new THREE.Mesh(
          new THREE.SphereGeometry(def.size * 0.27, 32, 32),
          new THREE.MeshStandardMaterial({ color: 0xcfd3db, roughness: 0.95 })
        );
        moonMesh.position.set(def.size * 3.2, 0, 0);
        moonPivot.add(moonMesh);
        def.moonPivot = moonMesh; // will hold world-position lookups via parent chain
        def._moonPivotObj = moonPivot;
      }

      def._pivot = pivot;
      def._mesh = mesh;
      bodies.push(def);

      clickable.push({ name: def.name, obj: mesh, size: def.size });
      if (moonMesh){
        clickable.push({ name: 'Moon', sub: "Earth's Moon", obj: moonMesh, size: def.size * 0.27 });
      }
    });
    clickable.push({ name: 'Sun', obj: sun, size: 4 });

    // ---------------- ফোকাস / জুম-টু-বডি নিয়ন্ত্রণ ----------------
    let focused = null; // { obj, size }
    const tmpV = new THREE.Vector3();

    function setFocus(entry){
      focused = entry || null;
      if (!focused){
        backBtn.classList.remove('show');
        labelEl.classList.remove('show');
        return;
      }
      backBtn.classList.add('show');
      labelEl.classList.add('show');
      labelEl.innerHTML = focused.name + (focused.sub ? '<small>' + focused.sub + '</small>' : '');
    }
    window.__exitFocus = () => setFocus(null);

    // ---------------- ট্যাপ/ক্লিকে গ্রহ শনাক্তকরণ (drag থেকে আলাদা করার জন্য) ----------------
    const raycaster = new THREE.Raycaster();
    const pointerVec = new THREE.Vector2();
    let downPos = null, downTime = 0;

    function onDown(e){
      const p = e.touches ? e.touches[0] : e;
      downPos = { x: p.clientX, y: p.clientY };
      downTime = performance.now();
    }
    function onUp(e){
      if (!downPos) return;
      const p = e.changedTouches ? e.changedTouches[0] : e;
      const dist = Math.hypot(p.clientX - downPos.x, p.clientY - downPos.y);
      const dt = performance.now() - downTime;
      downPos = null;
      if (dist > 8 || dt > 500) return; // এটা ড্র্যাগ/পিঞ্চ ছিল, ট্যাপ নয়

      const rect = canvas.getBoundingClientRect();
      pointerVec.x = ((p.clientX - rect.left) / rect.width) * 2 - 1;
      pointerVec.y = -((p.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointerVec, camera);
      const hits = raycaster.intersectObjects(clickable.map(c => c.obj), false);
      if (hits.length){
        const hitObj = hits[0].object;
        const entry = clickable.find(c => c.obj === hitObj);
        if (entry) setFocus(entry);
      } else {
        setFocus(null);
      }
    }
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointerup', onUp);

    // ---------------- resize ----------------
    function onResize(){
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onResize);

    // ---------------- মূল অ্যানিমেশন লুপ ----------------
    const clock = new THREE.Clock();
    let rafId = null;

    function tick(){
      rafId = requestAnimationFrame(tick);
      const delta = clock.getDelta();
      const now = new Date();

      bodies.forEach(def => {
        def._pivot.rotation.y = orbitAngle(def.period, def.L0, now);
        def._mesh.rotation.y += delta * 0.25; // নিজ অক্ষে ঘূর্ণন (দৃশ্যগত জীবন্ততার জন্য)
        if (def._moonPivotObj){
          def._moonPivotObj.rotation.y = orbitAngle(27.32, 0, now);
        }
        if (def.key === 'earth'){
          // বাস্তব সময় অনুযায়ী পৃথিবীর নিজ ঘূর্ণন - কোন দেশে এখন দিন/রাত তা সূর্যালোক অনুযায়ী দেখা যাবে
          const utc = def._mesh; // rotation already includes spin above; fine as a live-ish effect
        }
      });

      // ফোকাসকৃত বস্তুর দিকে ক্যামেরা ও টার্গেট মসৃণভাবে এগিয়ে যাওয়া/অনুসরণ করা
      if (focused){
        focused.obj.getWorldPosition(tmpV);
        controls.target.lerp(tmpV, 0.1);
        const desiredDist = Math.max(focused.size * 4.2, controls.minDistance * 1.4);
        const curDist = camera.position.distanceTo(tmpV);
        if (curDist > desiredDist * 1.25){
          const dir = camera.position.clone().sub(tmpV).normalize();
          const newDist = THREE.MathUtils.lerp(curDist, desiredDist, 0.05);
          camera.position.copy(tmpV.clone().add(dir.multiplyScalar(newDist)));
        }
      } else {
        controls.target.lerp(new THREE.Vector3(0,0,0), 0.08);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    // পারফরম্যান্স: ট্যাব হাইড হলে রেন্ডার লুপ পজ করা
    document.addEventListener('visibilitychange', () => {
      if (document.hidden){
        if (rafId !== null){ cancelAnimationFrame(rafId); rafId = null; }
      } else if (rafId === null){
        tick();
      }
    });

    tick();
  </script>
</body>
